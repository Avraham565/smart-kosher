[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-kosher"
version = "0.1.0"
description = "Offline Jewish-calendar home automation core"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["microdot"]

[project.optional-dependencies]
# What the README's verification commands need. Without this a clean clone can
# read "python -m pytest -q" and have nothing to run it with.
#   python -m pip install -e ".[dev]"
dev = ["pytest", "ruff", "pyserial"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["smart_kosher*"]

[tool.setuptools.package-data]
smart_kosher = ["data/*.json"]

[tool.pytest.ini_options]
# Keep collection to our own suite. This originally existed because pytest
# walked into the C firmware's vendored LVGL checkout and its self-running
# tests aborted the whole run; that tree is gone, but pinning the path is
# still the behaviour we want.
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
# Exploratory probe scripts are not held to production lint.
extend-exclude = ["tools/zigbee_probe"]
# First-party roots. `panel_mp` and `client` are flat by necessity -- the
# device (and the bundled exe) import those modules from their own root, so
# `import store` is first-party even though there is no package. Without them
# listed, ruff read every such import as third-party and each file carried a
# permanent, unfixable I001.
src = [".", "src", "panel_mp", "client"]

[tool.ruff.lint]
# Correctness core (pyflakes + selected pycodestyle) plus import ordering.
# Deliberately not enforcing stylistic rewrites (f-strings, etc.).
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# MicroPython firmware: create_task() results are kept in locals on purpose
# so the event loop's tasks are not garbage-collected. Not dead variables.
"products/hub/device/main.py" = ["F841"]
