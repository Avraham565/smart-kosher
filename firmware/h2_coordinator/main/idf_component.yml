## IDF Component Manager Manifest File
##
## esp-zigbee-lib is pinned exactly. This firmware is written against
## symbol-level facts of one specific release -- ezb_af_user_cnf_t,
## cmd_ctrl.cnf_ctx, EZB_ZCL_CORE_CONFIG_REPORT_RSP_CB_ID, the
## reportable_change union -- each established by reading that version's
## headers and confirming the behaviour on real hardware. It used to say
## ">=2.0.0" with dependencies.lock gitignored, so every build silently
## resolved whatever was newest and no two builds were guaranteed to be the
## same firmware. Raising it is a deliberate act: rebuild, reflash, and re-run
## products/panel/host/run_hwtest.py before trusting the result.
##
## The IDF constraint below is a floor, NOT a pin, and cannot be otherwise:
## this manifest can only *reject* an incompatible toolchain, never *select*
## one. Which IDF actually builds the firmware is decided by whatever
## tools/build_h2_coordinator.ps1 sources, so that script prints and records
## the version instead. dependencies.lock captures what a build really used
## (5.3.0 for the hardware-verified 0.11.x/0.12.0 builds), and because the
## script copies it back into the repo, a toolchain change shows up as a diff.
dependencies:
  idf: ">=5.3"
  espressif/esp-zigbee-lib: "==2.0.3"
