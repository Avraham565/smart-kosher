<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Kosher</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header class="app-header">
    <span class="app-title">Smart Kosher</span>
    <span id="header-status" class="header-status"></span>
  </header>

  <main class="app-main" id="app-main">
    <!-- content rendered by JS -->
  </main>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="devices" onclick="showTab('devices')">מכשירים</button>
    <button class="tab-btn" data-tab="schedules" onclick="showTab('schedules')">תזמונים</button>
    <button class="tab-btn" data-tab="settings" onclick="showTab('settings')">⚙ הגדרות</button>
    <button class="tab-btn" data-tab="connection" onclick="showTab('connection')">🔌 חיבור</button>
  </nav>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span id="modal-title" class="modal-title"></span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
