<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Kosher</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-lockup">
      <span class="brand-mark" aria-hidden="true">SK</span>
      <span class="app-title">Smart Kosher</span>
    </div>
    <button id="header-status" class="header-status" type="button" data-action="show-tab" data-tab="connection">
      בודק חיבור
    </button>
  </header>

  <main class="app-main" id="app-main" tabindex="-1">
    <!-- content rendered by JS -->
  </main>

  <nav class="tab-nav" aria-label="ניווט ראשי">
    <button class="tab-btn active" type="button" data-action="show-tab" data-tab="devices">
      <span aria-hidden="true">⌁</span>
      <span>מכשירים</span>
    </button>
    <button class="tab-btn" type="button" data-action="show-tab" data-tab="schedules">
      <span aria-hidden="true">◷</span>
      <span>תזמונים</span>
    </button>
    <button class="tab-btn" type="button" data-action="show-tab" data-tab="settings">
      <span aria-hidden="true">⚙</span>
      <span>הגדרות</span>
    </button>
    <button class="tab-btn" type="button" data-action="show-tab" data-tab="connection">
      <span aria-hidden="true">⎋</span>
      <span>חיבור</span>
    </button>
  </nav>

  <div id="toast-host" class="toast-host" aria-live="polite" aria-atomic="true"></div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <section
      class="modal-box"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title"></h2>
        <button class="modal-close" type="button" aria-label="סגור חלון" data-action="modal-close">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </section>
  </div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
